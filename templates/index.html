<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпаргалка по игре "Что? Где? Когда?"</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-title">
                <h1>"Что? Где? Когда?"</h1>
                <p>Отличники вперед!!!</p>
            </div>
            <div class="search-container" role="search">
                <label for="searchInput" class="visually-hidden">Поиск по вопросам, ответам и темам</label>
                <input type="text" id="searchInput" placeholder="Поиск " aria-label="Поиск..">
                <button id="searchButton" aria-label="Выполнить поиск">🔍</button>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему оформления">🌙</button>
        </div>
    </header>

    <main>
        <div class="controls-section">
            <div class="controls" role="group" aria-label="Настройки отображения">
                <label for="perPage">Вопросов на странице:</label>
                <select id="perPage" aria-label="Количество вопросов на странице">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>

            <div class="controls" role="group" aria-label="Фильтр по году">
                <label for="filterYear">Год:</label>
                <select id="filterYear" aria-label="Фильтр по году">
                    <option value="all" selected>Все годы</option>
                </select>
            </div>

            <div class="controls" role="group" aria-label="Режим отображения">
                <label for="viewMode">Режим просмотра:</label>
                <select id="viewMode" aria-label="Режим отображения">
                    <option value="grid" selected>Сетка</option>
                    <option value="card">Карточка</option>
                </select>
            </div>
        </div>

        <div id="questionsContainer">
            <!-- Questions will be loaded here -->
        </div>

        <div class="pagination" role="navigation" aria-label="Навигация по страницам">
            <button id="prevPage" aria-label="Предыдущая страница">◀ Назад</button>
            
            <div class="page-input-container">
                <label for="pageNumberInput" class="page-number-label">Страница:</label>
                <input type="number" id="pageNumberInput" class="page-number-input" min="1" value="1">
                <span class="page-number-slash">/</span>
                <span id="totalPages" class="total-pages">1</span>
                <button id="goToPage" class="go-to-page-btn" aria-label="Перейти к указанной странице">Перейти</button>
            </div>
            
            <span id="pageInfo" class="page-info" aria-live="polite"></span>
            
            <button id="nextPage" aria-label="Следующая страница">Вперед ▶</button>
        </div>
    </main>

    <footer>
        <p>Данные собраны с неофициального сайта ЧГК</p>
        <p>Всего вопросов в базе: <span id="totalCount">0</span></p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
